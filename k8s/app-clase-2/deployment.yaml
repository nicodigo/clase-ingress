# ── Deployment ────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: load-api
  namespace: load-api
  labels:
    app: load-api-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: load-api
  template:
    metadata:
      labels:
        app: load-api
    spec:
      containers:
        - name: load-api
          # Reemplazar con la imagen publicada en GCR / Artifact Registry
          # Ej: gcr.io/<PROJECT_ID>/load-api:latest
          image: us-central1-docker.pkg.dev/test-hpa-unlu-2026/k8s-exercise/api-load:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: UVICORN_WORKERS
              value: "1"           # 1 worker por pod en k8s es lo recomendado
          resources:
            requests:
              cpu: "125m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "500Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
      # Política de reinicio ante fallos
      restartPolicy: Always
